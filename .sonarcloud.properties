# Automatic SonarQube Cloud analysis, as used by the other maintained forks.
sonar.sources=.
sonar.tests=tests
# Generated bundles duplicate their TypeScript sources; keep all authored code.
sonar.exclusions=tests/**,dist/**,coverage/**,node_modules/**,meteoswiss-weather-card.js,meteoswiss-weather-card.js.map
sonar.sourceEncoding=UTF-8
