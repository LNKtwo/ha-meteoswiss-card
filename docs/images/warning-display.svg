<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title description">
  <title id="title">Source-aware warning display examples</title>
  <desc id="description">Illustrative examples using synthetic inputs: a drought warning with the original provider text, and an unavailable warning source. No live hazard information.</desc>
  <rect width="900" height="270" rx="22" fill="#0f172a"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="37" fill="#f8fafc" font-size="19" font-weight="600">Source-aware weather warnings</text>
    <rect x="32" y="59" width="402" height="156" rx="14" fill="#2b1c29" stroke="#ef4444"/>
    <rect x="32" y="69" width="4" height="136" rx="2" fill="#ef4444"/>
    <path d="M65 83c-5 7-10 12-10 18a10 10 0 0 0 20 0c0-6-5-11-10-18m-12 29 25-26" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <text x="91" y="91" fill="#f87171" font-size="19" font-weight="600">Drought</text>
    <text x="91" y="115" fill="#e2e8f0" font-size="14">Level 4 – high danger</text>
    <text x="56" y="156" fill="#f8fafc" font-size="14">Original provider text appears here.</text>
    <text x="56" y="181" fill="#cbd5e1" font-size="12">Family and severity supplied by the integration</text>
    <rect x="466" y="59" width="402" height="156" rx="14" fill="#1e293b" stroke="#64748b"/>
    <path d="m493 98 12-20 12 20z" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M505 84v6m0 4v1" stroke="#cbd5e1" stroke-width="2"/>
    <text x="531" y="91" fill="#f8fafc" font-size="17" font-weight="600">Warning data unavailable</text>
    <text x="490" y="143" fill="#cbd5e1" font-size="14">A source failure has its own status.</text>
    <text x="490" y="181" fill="#cbd5e1" font-size="12">Retained alerts are not presented as current.</text>
    <text x="32" y="245" fill="#94a3b8" font-size="12">Illustration based on synthetic test inputs. No live warning information.</text>
  </g>
</svg>
